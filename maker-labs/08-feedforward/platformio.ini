; Maker Lab — 08-feedforward ESP32 韌體
; 可直接燒錄實機:在本章目錄執行  pio run -t upload  然後  pio device monitor -b 115200
; 共用控制 lib(pid/encoder/filter/observer/...)以 include path 帶入 ../firmware/lib
; host 編譯/單元測試驗證見 ../verify_firmware.sh(不需實機)
[platformio]
src_dir = firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/../firmware/lib
    -I${PROJECT_DIR}/../firmware
